<section
  class="results-export"
  aria-labelledby="results-export-title"
  data-customer-ready-export="{{ 'true' if results.customer_ready_export else 'false' }}"
>
  <header class="results-export__heading">
    <div>
      <p class="results-eyebrow">Export center</p>
      <h2 id="results-export-title">Save and export</h2>
    </div>
    <span class="results-export__state">
      {{ "Customer-ready" if results.customer_ready_export else "Draft" }}
    </span>
  </header>
  <p class="results-export__note">
    The Excel workbook remains available while readiness is incomplete. The status badge shows whether the workbook is still draft or customer-ready.
  </p>
  <div class="results-export__actions">
    <form method="post" action="{{ url_for('index') }}">
      <input type="hidden" name="action" value="save_assessment" />
      <input type="hidden" name="assessment_name" value="{{ results.assessment_name }}" />
      <input type="hidden" name="assessment_notes" value="{{ results.assessment_notes }}" />
      <input type="hidden" name="return_to" value="{{ url_for('step4', tab='price') }}" />
      <button type="submit" class="results-button results-button--secondary">Save assessment</button>
    </form>
    <form method="post" action="{{ url_for('index') }}" data-assessment-save-form>
      <input type="hidden" name="action" value="export_assessment" />
      <input type="hidden" name="assessment_name" value="{{ results.assessment_name }}" />
      <input type="hidden" name="assessment_notes" value="{{ results.assessment_notes }}" />
      <button
        type="submit"
        class="results-button results-button--secondary"
        data-assessment-save
      >Export assessment JSON</button>
    </form>
    <form
      method="post"
      action="{{ url_for('import_assessment_route') }}"
      enctype="multipart/form-data"
      data-assessment-open-form
    >
      <input type="hidden" name="action" value="import_assessment" />
      <input
        type="file"
        name="assessment_file"
        accept=".json,application/json"
        hidden
        data-assessment-open-file
      />
      <button
        type="button"
        class="results-button results-button--secondary"
        data-assessment-open
      >Import assessment JSON</button>
    </form>
    <form method="post" action="{{ url_for('step4') }}">
      <input type="hidden" name="action" value="export_excel" />
      <input type="hidden" name="active_scenario" value="price" />
      <button type="submit" class="results-button">{{ results.excel_export_label }}</button>
    </form>
    <form method="post" action="{{ url_for('step4') }}">
      <input type="hidden" name="action" value="generate_presentation" />
      <input type="hidden" name="active_scenario" value="price" />
      <label class="results-export__presentation-select">
        <span>Presentation scenario</span>
        <select name="presentation_scenario" data-presentation-scenario>
          <option value="native">OCI Compute Migration</option>
          <option value="ocvs">Oracle Cloud VMware Solution</option>
          <option value="hybrid">OCI Hybrid</option>
        </select>
      </label>
      <button type="submit" class="results-button">Generate Presentation</button>
    </form>
  </div>
</section>
<script>
  (function () {
    const field = document.querySelector('[data-presentation-scenario]');
    if (!field) return;
    const scenario = window.localStorage.getItem('migration-assessment:presentation-scenario');
    if (['native', 'ocvs', 'hybrid'].includes(scenario)) field.value = scenario;
  })();
</script>
